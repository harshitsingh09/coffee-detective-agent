[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-ai-assistant"
version = "0.1.0"
description = "Bounded production incident investigation agent with safe tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "google-genai==2.18.1",
    "groq==1.6.0",
    "openai==2.54.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "sentence-transformers==6.0.0",
    "streamlit==1.61.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.16.3",
]

[project.scripts]
incident-assistant = "incident_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["incident_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
